name: Build ATAC Roma APK

on:
  push:
    branches:
      - claude/atac-roma-realtime-app-6lg237
    paths:
      - "atac-roma-android/**"
      - ".github/workflows/android-atac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: atac-roma-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: atac-roma-debug-apk
          path: atac-roma-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: atac-android-latest
          name: ATAC Roma Live — ultima build
          body: |
            APK debug di ATAC Roma Live, rigenerata a ogni push del branch.
            Commit: ${{ github.sha }}
          files: atac-roma-android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
