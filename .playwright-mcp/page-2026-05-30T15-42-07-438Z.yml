              - paragraph [ref=e291]:
                - text: Claqo è una piattaforma di gestione per case di post-produzione audiovisiva, con un assistente AI integrato come
                - strong [ref=e292]: co-pilota
                - text: . Coordina il lavoro dalla quotazione iniziale fino al cost report finale.
              - heading "Filosofia" [level=2] [ref=e293]
              - list [ref=e294]:
                - listitem [ref=e295]:
                  - strong [ref=e296]: AI propone, utente dispone.
                  - text: Ogni mutazione automatizzata richiede una conferma esplicita. Niente azioni "magiche" non tracciate.
                - listitem [ref=e297]:
                  - strong [ref=e298]: Funziona anche senza AI.
                  - text: "Il copilota è un acceleratore, non un requisito: se non configuri provider AI, Claqo resta pienamente operativo."
                - listitem [ref=e299]:
                  - strong [ref=e300]: Listino modulare.
                  - text: "Il listino non è uno standard rigido: ogni casa di post ha il suo, e il sistema si adatta."
