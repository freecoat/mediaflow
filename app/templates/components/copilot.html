{# Drawer chat copilot AI — incluso in base.html, presente su tutte le pagine #}
<style>
  #copilot-fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 800;
    width: 52px; height: 52px; border-radius: 14px; /* rounded-square per mascot */
    background: transparent; color: #fff; border: none; cursor: pointer; padding: 0;
    box-shadow: 0 8px 22px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  #copilot-fab svg { width: 100%; height: 100%; display: block; }
  #copilot-fab:hover { transform: scale(1.08); box-shadow: 0 12px 28px rgba(216,90,48,.55); }
  #copilot-fab.has-error { box-shadow: 0 0 0 3px #ef4444, 0 8px 22px rgba(0,0,0,.45); }
  #copilot-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
    z-index: 850;
  }
  #copilot-drawer {
    position: fixed; top: 0; right: -440px; height: 100vh; width: 420px;
    background: var(--bg2); border-left: 1px solid var(--border);
    box-shadow: -10px 0 30px rgba(0,0,0,.4);
    z-index: 860; transition: right .25s ease;
    display: flex; flex-direction: column;
  }
  body.copilot-open #copilot-overlay { opacity: 1; pointer-events: auto; }
  body.copilot-open #copilot-drawer { right: 0; }

  .cp-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .cp-head h3 { font-size: 14px; flex: 1; margin: 0; }
  .cp-head button { background: transparent; color: var(--text2); border: none; cursor: pointer; font-size: 18px; }
  .cp-context-tag {
    background: var(--indigo-bg); color: var(--indigo2);
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
  }

  .cp-conv-bar {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text2);
  }
  .cp-conv-bar select {
    flex: 1; background: var(--bg3); color: var(--text); border: 1px solid var(--border);
    padding: 4px 8px; border-radius: 4px; font-size: 12px;
  }

  .cp-messages {
    flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .cp-msg { max-width: 88%; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; }
  .cp-msg.user { align-self: flex-end; background: var(--indigo-bg); color: var(--text); border: 1px solid var(--indigo-border); }
  .cp-msg.assistant { align-self: flex-start; background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .cp-msg.assistant pre { background: var(--surface); padding: 6px 8px; border-radius: 4px; font-size: 11px; overflow-x: auto; }
  .cp-msg.assistant code { background: var(--surface); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  .cp-msg .cp-msg-meta { font-size: 10px; color: var(--text3); margin-top: 4px; }

  .cp-action-card {
    align-self: flex-start; max-width: 95%;
    background: var(--bg3); border: 1px solid var(--indigo-border);
    border-radius: 10px; padding: 10px 12px; font-size: 12px;
  }
  .cp-action-card.applied { border-color: #4ade80; }
  .cp-action-card.rejected, .cp-action-card.failed { border-color: #ef4444; opacity: .7; }
  .cp-action-card .cp-action-type {
    font-size: 10px; color: var(--indigo2); text-transform: uppercase; letter-spacing: .04em;
  }
  .cp-action-card .cp-action-title { font-weight: 600; margin: 2px 0 6px; }
  .cp-action-card .cp-action-summary {
    background: rgba(98,114,245,0.06); padding: 8px 10px; border-radius: 6px;
    border-left: 3px solid var(--indigo); margin: 6px 0 8px; line-height: 1.5;
  }
  .cp-action-card .cp-action-summary b { color: var(--indigo); font-weight: 600; }
  .cp-action-card .cp-muted { color: var(--text2); font-size: 11px; }
  .cp-action-card .cp-mini-table {
    width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 11px;
  }
  .cp-action-card .cp-mini-table th,
  .cp-action-card .cp-mini-table td {
    padding: 3px 5px; border-bottom: 1px solid rgba(98,114,245,0.12); text-align: left;
  }
  .cp-action-card .cp-mini-table th {
    font-weight: 600; color: var(--text2); font-size: 10px; text-transform: uppercase;
  }
  .cp-action-card .cp-mini-table th:nth-child(n+2),
  .cp-action-card .cp-mini-table td:nth-child(n+2) { text-align: right; font-family: 'DM Mono', monospace; }
  .cp-action-card .cp-debug-toggle {
    background: none; border: none; color: var(--text3); font-size: 11px;
    cursor: pointer; padding: 4px 0; font-family: 'DM Mono', monospace;
  }
  .cp-action-card .cp-debug-toggle:hover { color: var(--indigo); }
  .cp-action-card .cp-action-data {
    font-family: 'DM Mono', monospace; font-size: 11px;
    background: var(--surface); padding: 6px 8px; border-radius: 4px;
    max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    margin: 4px 0 0;
  }
  .cp-action-card .cp-action-data[hidden] { display: none; }
  .cp-action-card .cp-action-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .cp-action-card .cp-action-status {
    font-size: 10px; color: var(--text3); margin-top: 6px;
  }

  .cp-input-bar {
    border-top: 1px solid var(--border); padding: 10px;
    display: flex; gap: 6px; align-items: flex-end;
  }
  .cp-input-bar textarea {
    flex: 1; background: var(--bg3); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 13px; resize: none; min-height: 36px; max-height: 160px;
    font-family: inherit;
  }
  .cp-input-bar textarea:focus { outline: none; border-color: var(--indigo); }
  .cp-input-bar button {
    background: var(--indigo); color: #fff; border: none; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: background 120ms;
  }
  .cp-input-bar button:disabled { opacity: .5; cursor: not-allowed; }
  .cp-input-bar button.cp-stop { background: #ef4444; }
  .cp-input-bar button.cp-stop:hover { background: #dc2626; }

  /* v3.5.0-alpha.51 — allegati copilot */
  .cp-attach-btn {
    background: transparent !important;
    color: var(--text2) !important;
    border: 1px solid var(--border) !important;
    width: 36px; height: 36px; padding: 0 !important;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cp-attach-btn:hover { background: var(--bg3) !important; color: var(--text) !important; }
  .cp-attachments {
    display: flex; flex-direction: column; gap: 4px;
    padding: 6px 14px 0; max-height: 140px; overflow-y: auto;
  }
  .cp-attachment {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 6px; font-size: 11.5px;
  }
  .cp-attachment .cp-att-name { flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-attachment .cp-att-meta { color: var(--text3); font-size: 10.5px; }
  .cp-attachment .cp-att-x {
    background: transparent; border: 0; color: var(--text3); cursor: pointer;
    padding: 2px 5px; font-size: 14px; line-height: 1;
  }
  .cp-attachment .cp-att-x:hover { color: #ef4444; }
  .cp-attachment.uploading { opacity: 0.6; }
  .cp-attachment.error { border-color: #ef4444; color: #ef4444; }
  /* Drop zone overlay quando si trascina sopra il drawer */
  body.cp-dragover #copilot-drawer::after {
    content: "Rilascia qui per allegare";
    position: absolute; inset: 0; z-index: 100;
    background: rgba(98,114,245,0.12);
    border: 2px dashed var(--indigo);
    display: flex; align-items: center; justify-content: center;
    color: var(--indigo2); font-size: 18px; font-weight: 600;
    pointer-events: none;
  }

  .cp-empty {
    padding: 30px 20px; text-align: center; color: var(--text3); font-size: 12px;
  }
  /* v3.5.0-alpha.50: quick prompts cliccabili nel welcome */
  .cp-quick-prompts {
    display: flex; flex-direction: column; gap: 6px;
    padding: 14px 16px; text-align: left;
  }
  .cp-quick-prompts .cp-qp-section {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text3); font-weight: 600; margin-top: 6px;
  }
  .cp-quick-prompts .cp-qp-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 8px 10px;
    border-radius: 8px;
    text-align: left;
    font-size: 12.5px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .cp-quick-prompts .cp-qp-btn:hover {
    background: var(--bg3);
    color: var(--text);
    border-color: var(--indigo);
  }
  .cp-quick-prompts .cp-qp-icon { margin-right: 6px; }
  .cp-typing { font-size: 11px; color: var(--text3); padding: 0 14px 6px; }
</style>

<button id="copilot-fab" onclick="copilotOpen()" title="Apri Claqo Bot" aria-label="Apri Claqo Bot">
  {# v3.5.0-alpha.172.72 — Mascot Claqo brand-pack ufficiale #}
  <img src="/static/img/claqo-mascot.svg?v={{ app_version }}" alt="Claqo bot" width="52" height="52" style="display:block;">
</button>
<div id="copilot-overlay" onclick="copilotClose()"></div>
<div id="copilot-drawer" role="dialog" aria-label="Copilot AI">
  <div class="cp-head">
    <span style="display:inline-flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden;">
      <img src="/static/img/claqo-mascot.svg?v={{ app_version }}" alt="Claqo bot" width="26" height="26" style="display:block;">
    </span>
    <h3>Copilot</h3>
    <span class="cp-context-tag" id="cp-context-tag">—</span>
    <button onclick="copilotNewConv()" title="Nuova conversazione"><i data-lucide="plus"></i></button>
    <button onclick="copilotClose()" title="Chiudi"><i data-lucide="x"></i></button>
  </div>
  <div class="cp-conv-bar">
    <span>Storia:</span>
    <select id="cp-conv-select" onchange="copilotLoadConv(this.value)" style="flex:1;min-width:0;">
      <option value="">(nuova)</option>
    </select>
    <!-- v3.5.0-alpha.172.80 (Bundle D1) — Rinomina + elimina conversazione -->
    <button type="button" id="cp-conv-rename" onclick="copilotRenameConv()" title="Rinomina conversazione" style="background:transparent;border:0;color:inherit;cursor:pointer;padding:2px 4px;display:none;">
      <i data-lucide="pencil" style="width:14px;height:14px;"></i>
    </button>
    <button type="button" id="cp-conv-delete" onclick="copilotDeleteConv()" title="Elimina conversazione" style="background:transparent;border:0;color:inherit;cursor:pointer;padding:2px 4px;display:none;">
      <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
    </button>
  </div>
  <div class="cp-messages" id="cp-messages">
    <!-- Quick prompts dinamici — popolati da copilot.js _renderWelcome() in base
         alla pagina corrente (es. /planning ha prompts dedicati a operazioni timeline). -->
    <div class="cp-empty" id="cp-welcome"></div>
  </div>
  <div class="cp-typing" id="cp-typing" style="display:none;">Sta pensando…</div>
  <!-- v3.5.0-alpha.51: lista allegati visibili sopra l'input -->
  <div class="cp-attachments" id="cp-attachments" style="display:none;"></div>
  <div class="cp-input-bar">
    <button class="cp-attach-btn" type="button" onclick="document.getElementById('cp-file-input').click()" title="Allega documento (PDF/DOCX/TXT/MD/immagine, max 20MB)">
      <i data-lucide="paperclip" style="width:16px;height:16px;"></i>
    </button>
    <input type="file" id="cp-file-input" hidden multiple
           accept=".pdf,.docx,.txt,.md,.jpg,.jpeg,.png,.webp,.gif"
           onchange="copilotHandleFiles(this.files); this.value='';">
    <textarea id="cp-input" rows="1" placeholder="Scrivi qui (Enter = a capo, Ctrl/⌘+Enter = invia, 📎 per allegare)"
              onkeydown="copilotInputKey(event)" oninput="copilotResizeInput(this)"></textarea>
    <button id="cp-send" onclick="copilotSendOrStop()">Invia</button>
  </div>
</div>
<script src="/static/js/copilot.js?v={{ app_version }}"></script>
