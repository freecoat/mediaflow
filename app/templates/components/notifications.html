{# Notifiche drawer + bell + polling — v3.4.27 #}
<style>
  .topbar-bell {
    position: relative; background: transparent; border: none; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; transition: background 0.12s;
    margin-right: 6px;
  }
  .topbar-bell:hover { background: rgba(255,255,255,0.06); }
  .topbar-bell-icon { font-size: 18px; line-height: 1; }
  .topbar-bell-badge {
    position: absolute; top: 2px; right: 2px;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: #ef4444; color: #fff; border-radius: 9px;
    font-size: 10px; font-weight: 700; line-height: 18px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg, #0f1018); box-sizing: content-box;
  }
  .topbar-bell-badge.action {
    background: #fbbf24; color: #1a1d2e;
  }

  .notif-drawer {
    position: fixed; top: 0; right: -440px; width: 420px; height: 100vh;
    background: var(--bg-elev, #1a1d29); border-left: 1px solid var(--border, #2a2e3d);
    z-index: 9999; transition: right 0.25s ease; box-shadow: -4px 0 20px rgba(0,0,0,0.3);
    display: flex; flex-direction: column;
  }
  .notif-drawer.open { right: 0; }
  .notif-drawer-header {
    padding: 16px; border-bottom: 1px solid var(--border, #2a2e3d);
    display: flex; align-items: center; justify-content: space-between;
  }
  .notif-drawer-title { font-size: 16px; font-weight: 600; }
  .notif-drawer-actions { display: flex; gap: 6px; }
  .notif-drawer-body {
    flex: 1; overflow-y: auto; padding: 0;
  }
  .notif-card {
    padding: 12px 16px; border-bottom: 1px solid var(--border, #2a2e3d);
    cursor: pointer; transition: background 0.12s; position: relative;
  }
  .notif-card:hover { background: rgba(98,114,245,0.06); }
  .notif-card.unread { background: rgba(98,114,245,0.04); }
  .notif-card.unread::before {
    content: ''; position: absolute; left: 6px; top: 18px;
    width: 6px; height: 6px; border-radius: 50%; background: #6272f5;
  }
  .notif-card.action_required.unread::before { background: #fbbf24; }
  .notif-card.alert.unread::before { background: #ef4444; }
  .notif-card-title {
    font-size: 13px; font-weight: 600; margin-bottom: 3px;
    padding-left: 10px;
  }
  .notif-card-body {
    font-size: 12px; color: var(--text2, #aaa); padding-left: 10px;
    margin-bottom: 4px;
  }
  .notif-card-time {
    font-size: 11px; color: var(--text3, #888); padding-left: 10px;
  }
  .notif-card-actions {
    margin-top: 6px; padding-left: 10px; display: flex; gap: 6px;
  }
  .notif-empty {
    padding: 30px 20px; text-align: center; color: var(--text3, #888);
    font-size: 13px;
  }
</style>

<div class="notif-drawer" id="notif-drawer">
  <div class="notif-drawer-header">
    <span class="notif-drawer-title">🔔 Notifiche</span>
    <div class="notif-drawer-actions">
      <button class="btn btn-ghost btn-sm" id="notif-mark-all" onclick="notifMarkAllRead()" title="Segna tutte come lette">✓ Tutte lette</button>
      <button class="btn btn-ghost btn-icon" onclick="notifToggleDrawer()" title="Chiudi">✕</button>
    </div>
  </div>
  <div class="notif-drawer-body" id="notif-list">
    <div class="notif-empty">Caricamento…</div>
  </div>
</div>

<script>
// ── Notifiche: state + polling + drawer ──────────────────────
const NOTIF_POLL_MS = 30000; // 30s
let NOTIF_POLL_TIMER = null;
let NOTIF_DRAWER_OPEN = false;

const NOTIF_KIND_ICON = {
  unavailability_pending: '🏖',
  unavailability_approved: '✅',
  unavailability_rejected: '❌',
  booking_conflict: '⚠️',
  quote_status_changed: '💼',
  job_deadline_approaching: '⏰',
  // v3.4.32 — booking esecutivo
  booking_status_changed: '🎬',
  booking_overtime_pending: '🌙',
  booking_overtime_resolved: '🔔',
  custom: '🔔',
};

async function notifFetchUnread() {
  try {
    const r = await fetch('/notifications/api/unread-count');
    if (!r.ok) return;
    const j = await r.json();
    notifUpdateBadge(j.total || 0, j.action_required || 0);
  } catch (e) { /* network err: ignora, ritenta al prossimo poll */ }
}

function notifUpdateBadge(total, action) {
  const badge = document.getElementById('notif-badge');
  if (!badge) return;
  if (total <= 0) {
    badge.style.display = 'none';
    return;
  }
  badge.textContent = total > 99 ? '99+' : total;
  badge.style.display = '';
  badge.classList.toggle('action', action > 0);
}

async function notifLoadList() {
  const host = document.getElementById('notif-list');
  host.innerHTML = '<div class="notif-empty">Caricamento…</div>';
  try {
    const items = await api('GET', '/notifications/api/list?limit=50');
    if (!items.length) {
      host.innerHTML = '<div class="notif-empty">Nessuna notifica</div>';
      return;
    }
    host.innerHTML = items.map(n => {
      const icon = NOTIF_KIND_ICON[n.kind] || '🔔';
      const cls = `notif-card ${n.severity || 'info'} ${n.is_read ? '' : 'unread'}`;
      const t = new Date(n.created_at);
      const now = new Date();
      const diffMin = Math.floor((now - t) / 60000);
      let when;
      if (diffMin < 1) when = 'Ora';
      else if (diffMin < 60) when = `${diffMin} min fa`;
      else if (diffMin < 1440) when = `${Math.floor(diffMin/60)}h fa`;
      else when = t.toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
      return `<div class="${cls}" data-id="${n.id}" onclick="notifClick(${n.id}, ${JSON.stringify(n.link || '').replace(/"/g, '&quot;')})">
        <div class="notif-card-title">${icon} ${escapeHtml(n.title || '')}</div>
        ${n.body ? `<div class="notif-card-body">${escapeHtml(n.body)}</div>` : ''}
        <div class="notif-card-time">${when}</div>
      </div>`;
    }).join('');
  } catch (e) {
    host.innerHTML = '<div class="notif-empty" style="color:#ef4444;">Errore: '+(e.message||'')+'</div>';
  }
}

function notifToggleDrawer() {
  const d = document.getElementById('notif-drawer');
  NOTIF_DRAWER_OPEN = !NOTIF_DRAWER_OPEN;
  d.classList.toggle('open', NOTIF_DRAWER_OPEN);
  if (NOTIF_DRAWER_OPEN) notifLoadList();
}

async function notifClick(id, link) {
  try { await api('POST', `/notifications/api/${id}/read`); } catch(e){}
  await notifFetchUnread();
  if (link) {
    window.location.href = link;
  } else {
    notifLoadList();
  }
}

async function notifMarkAllRead() {
  try {
    await api('POST', '/notifications/api/mark-all-read');
    await notifFetchUnread();
    await notifLoadList();
    if (typeof toast === 'function') toast('Tutte segnate come lette', 'success');
  } catch(e) { if (typeof toast === 'function') toast(e.message, 'error'); }
}

// Click fuori dal drawer = chiudi
document.addEventListener('click', (e) => {
  const d = document.getElementById('notif-drawer');
  const btn = document.getElementById('notif-bell-btn');
  if (NOTIF_DRAWER_OPEN && d && btn && !d.contains(e.target) && !btn.contains(e.target)) {
    NOTIF_DRAWER_OPEN = false;
    d.classList.remove('open');
  }
});

// Avvio polling
notifFetchUnread();
NOTIF_POLL_TIMER = setInterval(notifFetchUnread, NOTIF_POLL_MS);
</script>
