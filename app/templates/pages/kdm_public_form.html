<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richiesta KDM/DKDM</title>
<link rel="stylesheet" href="/static/css/main.css">
<style>
  body { max-width: 720px; margin: 24px auto; padding: 0 16px; }
  label { display: block; margin-bottom: 12px; font-size: .9rem; }
  label input, label select, label textarea { display: block; width: 100%; margin-top: 4px; }
  fieldset { border: 1px solid var(--border, #444); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  legend { padding: 0 6px; font-weight: 600; }
  button[type=submit] { margin-top: 8px; padding: 10px 24px; background: var(--accent, #6272f5); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
  button[type=submit]:hover { opacity: .88; }
  .banner-ok { padding: 14px 18px; background: #1f8b4c; color: #fff; border-radius: 8px; margin-bottom: 20px; font-size: 1rem; }
</style>
</head><body>
<h2 data-i18n="kdm.pub.heading">🔑 Richiesta chiavi DCP (KDM / DKDM)</h2>
{% if project_title %}<p><span data-i18n="kdm.pub.project">Progetto:</span> <strong>{{ project_title }}</strong></p>{% endif %}

{% if submitted %}
<div class="banner-ok" data-i18n="kdm.pub.submitted">
  ✅ Richiesta inviata. Il team finishing è stato avvisato e riceverai conferma a breve.
</div>
{% else %}
<form method="post" action="/public/kdm/{{ token }}" enctype="multipart/form-data">
  <label><span data-i18n="kdm.pub.type">Tipo chiave</span>
    <select name="request_type">
      <option value="kdm" {% if pf.get('request_type')=='kdm' %}selected{% endif %} data-i18n="kdm.pub.type_kdm">KDM (cinema)</option>
      <option value="dkdm" {% if pf.get('request_type')=='dkdm' %}selected{% endif %} data-i18n="kdm.pub.type_dkdm">DKDM (distributore)</option>
    </select>
  </label>

  <label><span data-i18n="kdm.pub.title">Titolo film</span>
    <input name="requested_title" value="{{ pf.get('requested_title','') }}" placeholder="es. QUEER_FTR_IT-XX_EN_51_2K_20240901">
  </label>

  <label><span data-i18n="kdm.pub.cpl">CPL UUID del DCP</span> <small data-i18n="kdm.pub.cpl_hint">(opzionale — aiuta il matching automatico)</small>
    <input name="requested_cpl_uuid" value="{{ pf.get('requested_cpl_uuid','') }}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
  </label>

  <label><span data-i18n="kdm.pub.valid_from">Sblocco DA (data+ora)</span>
    <input type="datetime-local" name="valid_from">
  </label>

  <label><span data-i18n="kdm.pub.valid_to">Sblocco A (data+ora)</span>
    <input type="datetime-local" name="valid_to">
  </label>

  <label><span data-i18n="kdm.pub.cert">Certificato server (.pem)</span> <small data-i18n="kdm.pub.optional">(opzionale)</small>
    <input type="file" name="cert_file" accept=".pem,.crt,.cer">
  </label>

  <fieldset>
    <legend data-i18n="kdm.pub.contacts">Contatti</legend>
    <label><span data-i18n="kdm.pub.cinema_name">Cinema / Lab destinatario — nome</span>
      <input name="cinema_contact_name">
    </label>
    <label><span data-i18n="kdm.pub.cinema_email">Cinema / Lab destinatario — email</span>
      <input type="email" name="cinema_contact_email" placeholder="proiettore@cinema.it">
    </label>
    <label><span data-i18n="kdm.pub.lab_email">Lab email</span> <small data-i18n="kdm.pub.optional">(opzionale)</small>
      <input type="email" name="lab_contact_email">
    </label>
    <label><span data-i18n="kdm.pub.prod_name">Produzione — nome referente</span>
      <input name="production_contact_name">
    </label>
    <label><span data-i18n="kdm.pub.prod_email">Produzione — email referente</span>
      <input type="email" name="production_contact_email">
    </label>
  </fieldset>

  <label><span data-i18n="kdm.pub.notes">Note</span>
    <textarea name="notes" rows="3">{{ pf.get('notes','') }}</textarea>
  </label>

  <button type="submit" data-i18n="kdm.pub.submit">Invia richiesta</button>
</form>
{% endif %}

<script src="/static/js/i18n.js?v={{ app_version }}"></script>
<script src="/static/js/global.js?v={{ app_version }}"></script>
<script>
  // Form pubblico standalone: applica traduzioni + picker data/ora MF (memo
  // project_kdm_redesign — questa pagina non eredita base.html).
  document.addEventListener('DOMContentLoaded', function() {
    if (window.applyI18n) applyI18n();
    if (window.mfApplyTimePickers) mfApplyTimePickers(document);
  });
</script>
</body></html>
