<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MediaFlow</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark" style="width:38px;height:38px;border-radius:9px;background:var(--indigo);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;">MF</div>
      <span style="font-size:20px;font-weight:700;letter-spacing:-0.5px;">MediaFlow</span>
    </div>

    <p style="font-size:14px;color:var(--text2);margin-bottom:28px;" data-i18n="auth.title">Accedi alla piattaforma</p>

    {% if error %}
    <div style="background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--rose);margin-bottom:16px;">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/auth/login">
      <input type="hidden" name="next" value="{{ next or '/dashboard' }}">
      <div class="form-group">
        <label class="form-label" data-i18n="auth.email">Email</label>
        <input class="form-input" type="email" name="email" placeholder="nome@azienda.it" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="auth.password">Password</label>
        <input class="form-input" type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:8px;" data-i18n="auth.submit">
        Accedi
      </button>
    </form>

    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);">
      <strong style="color:var(--text);">Account demo:</strong><br>
      • <code>admin@mediaflow.it</code> / <code>admin123</code> (admin)<br>
      • <code>editor@mediaflow.it</code> / <code>editor123</code> (Luca Bianchi · staff)
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="/static/js/global.js?v=3.5.0-alpha.133"></script>
<script src="/static/js/i18n.js?v=3.5.0-alpha.156"></script>
</body>
</html>
