{% extends "base.html" %}
{% block content %}
<div id="mail-mobile-bar" class="mail-mobile-bar">
  <button class="btn btn-secondary btn-sm" id="mail-mb-labels" onclick="mailMobileView('labels')">☰ Etichette</button>
  <button class="btn btn-secondary btn-sm" id="mail-mb-back" onclick="mailMobileView('list')">← Indietro</button>
</div>
<div class="mail-layout" data-mail-view="list">
  <aside class="mail-nav">
    <button class="btn btn-primary btn-block" onclick="mfMailCompose()" data-i18n="mail.compose">Scrivi</button>
    <div id="mail-labels" class="mail-labels"></div>
  </aside>
  <section class="mail-list">
    <input id="mail-search" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.search"
           placeholder="Cerca nella posta…" onkeydown="if(event.key==='Enter')mfMailLoadThreads(true)">
    <div id="mail-actionbar" class="mail-actionbar">
      <span id="mail-sel-count" class="mail-sel-count"></span>
      <button class="btn btn-sm" data-mail-action="read" data-i18n="mail.markRead">Letto</button>
      <button class="btn btn-sm" data-mail-action="unread" data-i18n="mail.markUnread">Non letto</button>
      <button class="btn btn-sm" data-mail-action="star" data-i18n="mail.star">Stella</button>
      <button class="btn btn-sm" data-mail-action="archive" data-i18n="mail.archive">Archivia</button>
      <button class="btn btn-sm" data-mail-action="trash" data-i18n="mail.trash">Cestino</button>
      <select id="mail-move-select" class="form-input mail-move-select"></select>
    </div>
    <div id="mail-thread-list" class="mail-thread-list"></div>
    <button id="mail-loadmore" class="btn btn-secondary btn-block mail-loadmore" onclick="mfMailLoadThreads(false)" data-i18n="mail.loadMore">Carica altro</button>
  </section>
  <section id="mail-reading" class="mail-reading"></section>
</div>

<div id="mail-compose" class="modal-overlay">
  <div class="modal mail-compose-modal" style="display:flex;flex-direction:column;gap:8px;min-width:min(640px,92vw);">
    <input name="to" class="form-input" list="mail-contacts" autocomplete="off" data-i18n-attr="placeholder" data-i18n="mail.to" placeholder="A">
    <input name="cc" class="form-input" list="mail-contacts" autocomplete="off" placeholder="Cc">
    <input name="bcc" class="form-input" list="mail-contacts" autocomplete="off" placeholder="Bcc">
    <datalist id="mail-contacts"></datalist>
    <input name="subject" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.subject" placeholder="Oggetto">

    <div class="mail-toolbar" id="mail-toolbar">
      <select class="mail-tb-sel" data-mail-cmd="fontName" data-i18n-attr="title" data-i18n="mail.tbFont" title="Font">
        <option value="Arial, sans-serif">Sans</option>
        <option value="Georgia, serif">Serif</option>
        <option value="'Courier New', monospace">Mono</option>
      </select>
      <select class="mail-tb-sel" data-mail-cmd="fontSize" data-i18n-attr="title" data-i18n="mail.tbSize" title="Dimensione">
        <option value="2">S</option>
        <option value="3" selected>M</option>
        <option value="5">L</option>
        <option value="6">XL</option>
      </select>
      <button type="button" class="mail-tb-btn" data-mail-cmd="bold" data-i18n-attr="title" data-i18n="mail.tbBold" title="Grassetto"><b>B</b></button>
      <button type="button" class="mail-tb-btn" data-mail-cmd="italic" data-i18n-attr="title" data-i18n="mail.tbItalic" title="Corsivo"><i>I</i></button>
      <button type="button" class="mail-tb-btn" data-mail-cmd="underline" data-i18n-attr="title" data-i18n="mail.tbUnderline" title="Sottolineato"><u>U</u></button>
      <label class="mail-tb-btn mail-tb-color" data-i18n-attr="title" data-i18n="mail.tbColor" title="Colore testo">A<input type="color" data-mail-color value="#000000"></label>
      <span class="mail-tb-sep"></span>
      <button type="button" class="mail-tb-btn" data-mail-cmd="insertUnorderedList" data-i18n-attr="title" data-i18n="mail.tbBullets" title="Elenco puntato">•</button>
      <button type="button" class="mail-tb-btn" data-mail-cmd="insertOrderedList" data-i18n-attr="title" data-i18n="mail.tbNumbers" title="Elenco numerato">1.</button>
      <button type="button" class="mail-tb-btn" data-mail-cmd="formatBlock:blockquote" data-i18n-attr="title" data-i18n="mail.tbQuote" title="Citazione">❝</button>
      <button type="button" class="mail-tb-btn" data-mail-link data-i18n-attr="title" data-i18n="mail.tbLink" title="Link">🔗</button>
      <button type="button" class="mail-tb-btn" data-mail-cmd="removeFormat" data-i18n-attr="title" data-i18n="mail.tbClear" title="Rimuovi formattazione">⌫</button>
      <span class="mail-tb-sep"></span>
      <button type="button" class="mail-tb-btn" data-mail-attach data-i18n-attr="title" data-i18n="mail.tbAttach" title="Allega file">📎</button>
      <button type="button" class="mail-tb-btn mail-tb-wide" data-mail-signature data-i18n="mail.tbSignature" title="Firma">✎ Firma</button>
    </div>

    <div name="body" id="mail-body-editor" class="mail-editor" contenteditable="true"></div>

    <input type="hidden" name="thread_id"><input type="hidden" name="in_reply_to"><input type="hidden" name="references">
    <input type="file" id="mail-file-input" multiple hidden>
    <div id="mail-att-tray" class="mail-att-tray"></div>

    <div class="modal-actions" style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-primary" onclick="mfMailSend()" data-i18n="mail.send">Invia</button>
      <button class="btn btn-secondary" onclick="closeModal('mail-compose')">✕</button>
    </div>
  </div>
</div>

<div id="mail-signature-modal" class="modal-overlay">
  <div class="modal" style="display:flex;flex-direction:column;gap:8px;min-width:min(520px,92vw);">
    <h3 style="margin:0" data-i18n="mail.signatureTitle">Firma email</h3>
    <p class="muted" style="font-size:12px;margin:0" data-i18n="mail.signatureHint">Inserita automaticamente in fondo ai nuovi messaggi.</p>
    <div id="mail-signature-editor" class="mail-editor" contenteditable="true" style="min-height:120px"></div>
    <div class="modal-actions" style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-primary" onclick="mfMailSaveSignature()" data-i18n="mail.save">Salva</button>
      <button class="btn btn-secondary" onclick="closeModal('mail-signature-modal')" data-i18n="mail.cancel">Annulla</button>
    </div>
  </div>
</div>

<style>
  .mail-layout { display: grid; grid-template-columns: 200px 320px 1fr; gap: 12px; height: calc(100vh - 120px); }
  .mail-nav { display: flex; flex-direction: column; }
  .mail-labels { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .mail-list { display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  .mail-thread-list { display: flex; flex-direction: column; gap: 2px; }
  .mail-actionbar { display: none; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 4px; border-bottom: 1px solid var(--border2, #333); margin-bottom: 4px; }
  .mail-sel-count { font-size: 12px; color: var(--text3, #888); margin-right: 4px; }
  .mail-move-select { height: 30px; padding: 2px 6px; font-size: 12px; width: auto; }
  .mail-loadmore { display: none; margin-top: 8px; }
  .mail-label-count { font-size: 11px; background: var(--accent, #6272f5); color: #fff; border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .mail-thread-row { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .mail-thread-row:hover { background: var(--bg3, #222); }
  .mail-sel { margin: 0; }
  .mail-star { background: none; border: 0; cursor: pointer; font-size: 15px; color: var(--text3, #888); padding: 0; }
  .mail-star.mail-star-on { color: #f5c518; }
  .mail-row-main { min-width: 0; }
  .mail-row-quick { display: none; gap: 2px; }
  .mail-thread-row:hover .mail-row-quick { display: flex; }
  .mail-q { background: none; border: 0; cursor: pointer; font-size: 14px; padding: 2px; opacity: .7; }
  .mail-q:hover { opacity: 1; }
  .mail-row-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .mail-row-from { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row-date { color: var(--text3, #888); flex-shrink: 0; }
  .mail-row-subj { font-size: 13px; margin: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row-snip { font-size: 12px; color: var(--text3, #888); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row-count { font-size: 10px; background: var(--bg3, #333); border-radius: 8px; padding: 0 5px; margin-left: 4px; }
  .mail-thread-row.mail-unread { border-left: 3px solid var(--accent, #6272f5); }
  .mail-thread-row.mail-unread .mail-row-from,
  .mail-thread-row.mail-unread .mail-row-subj { font-weight: 700; }
  .mail-reading { overflow: auto; padding-right: 4px; }
  .mail-msg { border: 1px solid var(--border2, #333); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--bg2, #1a1a1a); }
  .mail-msg-head { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border2, #333); }
  .mail-msg-head b { font-size: 14px; }
  .mail-msg-head > div { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .mail-body-frame { width: 100%; min-height: 420px; border: 0; border-radius: 6px; background: #fff; }
  .mail-atts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .mail-att { font-size: 12px; padding: 3px 8px; border: 1px solid var(--border2, #333); border-radius: 4px; text-decoration: none; }
  .mail-msg-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .mail-mobile-bar { display: none; gap: 6px; margin-bottom: 8px; }
  #mail-mb-back { display: none; }
  /* Compose ricco (Gmail-like) */
  .mail-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; padding: 4px; border: 1px solid var(--border2, #333); border-radius: 6px; background: var(--bg3, #222); }
  .mail-tb-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; color: var(--text, #eee); font-size: 13px; }
  .mail-tb-btn:hover { background: var(--bg2, #1a1a1a); border-color: var(--border2, #333); }
  .mail-tb-wide { min-width: auto; }
  .mail-tb-sel { height: 28px; padding: 0 4px; font-size: 12px; background: var(--bg2, #1a1a1a); color: var(--text, #eee); border: 1px solid var(--border2, #333); border-radius: 4px; }
  .mail-tb-sep { width: 1px; height: 20px; background: var(--border2, #333); margin: 0 3px; }
  .mail-tb-color { position: relative; font-weight: 700; }
  .mail-tb-color input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .mail-editor { min-height: 260px; max-height: 50vh; overflow: auto; padding: 10px 12px; border: 1px solid var(--border2, #333); border-radius: 6px; background: #fff; color: #111; font-size: 14px; line-height: 1.5; }
  .mail-editor:focus { outline: 2px solid var(--accent, #6272f5); }
  .mail-editor blockquote { border-left: 3px solid #ccc; margin: 6px 0; padding-left: 10px; color: #555; }
  .mail-att-tray { display: flex; flex-wrap: wrap; gap: 6px; }
  .mail-att-tray:empty { display: none; }
  .mail-att-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 8px; background: var(--bg3, #222); border: 1px solid var(--border2, #333); border-radius: 4px; }
  .mail-att-chip button { background: none; border: 0; color: var(--text3, #888); cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
  .mail-att-chip button:hover { color: var(--danger, #e5484d); }
  .mail-editor.mail-drop-hover { outline: 2px dashed var(--accent, #6272f5); outline-offset: -4px; }
  @media (max-width: 768px) {
    .mail-mobile-bar { display: flex; }
    .mail-layout { grid-template-columns: 1fr; height: calc(100dvh - 150px); }
    .mail-layout[data-mail-view="list"] .mail-nav,
    .mail-layout[data-mail-view="list"] .mail-reading { display: none; }
    .mail-layout[data-mail-view="read"] .mail-nav,
    .mail-layout[data-mail-view="read"] .mail-list { display: none; }
    .mail-layout[data-mail-view="labels"] .mail-list,
    .mail-layout[data-mail-view="labels"] .mail-reading { display: none; }
    #mail-compose .modal { position: fixed; inset: 0; min-width: 0 !important; max-width: none; width: 100vw; height: 100dvh; border-radius: 0; overflow: auto; }
  }
</style>
<script src="/static/js/mail.js?v={{ app_version }}"></script>
<script>document.addEventListener('DOMContentLoaded', function(){ mfMailInit(); });</script>
{% endblock %}
