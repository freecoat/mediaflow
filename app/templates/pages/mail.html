{% extends "base.html" %}
{% block content %}
<div id="mail-mobile-bar" class="mail-mobile-bar">
  <button class="btn btn-secondary btn-sm" id="mail-mb-labels" onclick="mailMobileView('labels')">☰ Etichette</button>
  <button class="btn btn-secondary btn-sm" id="mail-mb-back" onclick="mailMobileView('list')">← Indietro</button>
</div>
<div class="mail-layout" data-mail-view="list">
  <aside class="mail-nav">
    <button class="btn btn-primary btn-block" onclick="mfMailCompose()" data-i18n="mail.compose">Scrivi</button>
    <div id="mail-labels" class="mail-labels"></div>
    <div class="mail-nav-foot">
      <button class="mail-nav-tool" onclick="mfMailLoadThreads(true)" data-i18n-attr="title" data-i18n="mail.syncNow" title="Sincronizza ora">↻</button>
      <button class="mail-nav-tool" onclick="mfMailOpenSettings()" data-i18n-attr="title" data-i18n="mail.settings" title="Impostazioni">⚙</button>
    </div>
  </aside>
  <section class="mail-list">
    <div class="mail-search-row">
      <input id="mail-search" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.search"
             placeholder="Cerca nella posta…" onkeydown="if(event.key==='Enter')mfMailLoadThreads(true)">
      <button class="mail-adv-toggle mail-ai-search" onclick="mfMailAiSearch()" data-i18n-attr="title" data-i18n="mail.aiSearch" title="Ricerca AI">✨</button>
      <button class="mail-adv-toggle" onclick="mfMailToggleAdvSearch()" data-i18n-attr="title" data-i18n="mail.advSearch" title="Ricerca avanzata">⋯</button>
    </div>
    <div id="mail-adv-search" class="mail-adv-search">
      <input id="mail-adv-from" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.advFrom" placeholder="Da">
      <input id="mail-adv-to" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.advTo" placeholder="A">
      <input id="mail-adv-subject" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.advSubject" placeholder="Oggetto">
      <input id="mail-adv-words" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.advWords" placeholder="Contiene le parole">
      <div class="mail-adv-dates">
        <label><span data-i18n="mail.advAfter">Dopo</span> <input id="mail-adv-after" type="date" class="form-input"></label>
        <label><span data-i18n="mail.advBefore">Prima</span> <input id="mail-adv-before" type="date" class="form-input"></label>
      </div>
      <label class="mail-adv-att"><input id="mail-adv-attach" type="checkbox"> <span data-i18n="mail.advHasAttach">Con allegati</span></label>
      <button class="btn btn-primary btn-sm" onclick="mfMailRunAdvSearch()" data-i18n="mail.advRun">Cerca</button>
    </div>
    <div id="mail-actionbar" class="mail-actionbar">
      <span id="mail-sel-count" class="mail-sel-count"></span>
      <button class="btn btn-sm" data-mail-action="read" data-i18n="mail.markRead">Letto</button>
      <button class="btn btn-sm" data-mail-action="unread" data-i18n="mail.markUnread">Non letto</button>
      <button class="btn btn-sm" data-mail-action="star" data-i18n="mail.star">Stella</button>
      <button class="btn btn-sm" data-mail-action="archive" data-i18n="mail.archive">Archivia</button>
      <button class="btn btn-sm" data-mail-action="trash" data-i18n="mail.trash">Cestino</button>
      <select id="mail-move-select" class="form-input mail-move-select"></select>
    </div>
    <div id="mail-thread-list" class="mail-thread-list"></div>
    <button id="mail-loadmore" class="btn btn-secondary btn-block mail-loadmore" onclick="mfMailLoadThreads(false)" data-i18n="mail.loadMore">Carica altro</button>
  </section>
  <section id="mail-reading" class="mail-reading"></section>
</div>

{% include "components/mail_compose.html" %}

<div id="mail-settings-modal" class="modal-overlay">
  <div class="modal mail-settings-box" style="display:flex;flex-direction:column;gap:12px;width:min(620px,94vw);max-height:90vh;">
    <div class="mail-set-head">
      <h3 style="margin:0" data-i18n="mail.settingsTitle">Impostazioni email</h3>
      <button class="mail-win-btn" onclick="closeModal('mail-settings-modal')" data-i18n-attr="title" data-i18n="mail.close" title="Chiudi">✕</button>
    </div>
    <div class="mail-set-tabs">
      <button class="mail-set-tab mail-set-tab-active" data-set-tab="general" data-i18n="mail.tabGeneral">Generali</button>
      <button class="mail-set-tab" data-set-tab="contacts" data-i18n="mail.tabContacts">Rubrica</button>
      <button class="mail-set-tab" data-set-tab="filters" data-i18n="mail.tabFilters">Filtri</button>
      <button class="mail-set-tab" data-set-tab="vacation" data-i18n="mail.tabVacation">Risposta automatica</button>
    </div>

    <div class="mail-set-panel" data-set-panel="general">
      <label class="mail-set-row"><input type="checkbox" id="mail-set-markread"> <span data-i18n="mail.setMarkRead">Segna come letto all'apertura</span></label>
      <label class="mail-set-row"><input type="checkbox" id="mail-set-autosave"> <span data-i18n="mail.setAutosave">Salvataggio automatico in bozze</span></label>
      <label class="mail-set-row"><input type="checkbox" id="mail-set-newwin"> <span data-i18n="mail.setNewWindow">Apri "Scrivi" in finestra separata</span></label>
      <label class="mail-set-row mail-set-inline"><span data-i18n="mail.setAutoRefresh">Aggiornamento automatico</span>
        <select id="mail-set-refresh" class="form-input">
          <option value="0" data-i18n="mail.refreshOff">Disattivato</option>
          <option value="30">30 s</option><option value="60">1 min</option>
          <option value="120">2 min</option><option value="300">5 min</option>
        </select>
      </label>
      <label class="mail-set-row mail-set-inline"><span data-i18n="mail.setDefaultFont">Font predefinito</span>
        <select id="mail-set-font" class="form-input">
          <option value="Arial, sans-serif">Arial</option><option value="Calibri, sans-serif">Calibri</option>
          <option value="Verdana, sans-serif">Verdana</option><option value="Tahoma, sans-serif">Tahoma</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet</option><option value="Georgia, serif">Georgia</option>
          <option value="'Times New Roman', serif">Times</option><option value="Garamond, serif">Garamond</option>
          <option value="'Courier New', monospace">Courier</option>
        </select>
      </label>
      <button class="btn btn-secondary btn-sm" onclick="mfMailOpenSignature()" data-i18n="mail.editSignature">Modifica firma…</button>
      <div class="modal-actions" style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-primary" onclick="mfMailSaveSettings()" data-i18n="mail.save">Salva</button>
      </div>
    </div>

    <div class="mail-set-panel" data-set-panel="contacts" hidden>
      <input id="mail-contacts-search" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.contactsSearch" placeholder="Cerca contatto…" oninput="mfMailRenderContacts()">
      <div id="mail-contacts-list" class="mail-contacts-list"></div>
    </div>

    <div class="mail-set-panel" data-set-panel="filters" hidden>
      <div id="mail-filters-list" class="mail-filters-list"></div>
      <div class="mail-filter-form">
        <div class="mail-filter-grid">
          <input id="mail-filt-from" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.advFrom" placeholder="Da">
          <input id="mail-filt-to" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.advTo" placeholder="A">
          <input id="mail-filt-subject" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.advSubject" placeholder="Oggetto">
          <input id="mail-filt-query" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.filtHasWords" placeholder="Contiene">
        </div>
        <label class="mail-adv-att"><input type="checkbox" id="mail-filt-attach"> <span data-i18n="mail.advHasAttach">Con allegati</span></label>
        <div class="mail-filter-actions-row">
          <span class="muted" data-i18n="mail.filtThen">Poi:</span>
          <label class="mail-set-inline"><span data-i18n="mail.filtApplyLabel">Applica etichetta</span><select id="mail-filt-label" class="form-input"></select></label>
          <label class="mail-adv-att"><input type="checkbox" id="mail-filt-markread"> <span data-i18n="mail.markRead">Segna letto</span></label>
          <label class="mail-adv-att"><input type="checkbox" id="mail-filt-star"> <span data-i18n="mail.star">Speciale</span></label>
          <label class="mail-adv-att"><input type="checkbox" id="mail-filt-archive"> <span data-i18n="mail.archive">Archivia</span></label>
        </div>
        <button class="btn btn-primary btn-sm" onclick="mfMailCreateFilter()" data-i18n="mail.filtCreate">Crea filtro</button>
      </div>
    </div>

    <div class="mail-set-panel" data-set-panel="vacation" hidden>
      <label class="mail-set-row"><input type="checkbox" id="mail-vac-enabled"> <span data-i18n="mail.vacEnable">Attiva risposta automatica</span></label>
      <input id="mail-vac-subject" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.vacSubject" placeholder="Oggetto risposta">
      <div id="mail-vac-body" class="mail-editor" contenteditable="true" style="min-height:120px"></div>
      <label class="mail-set-row"><input type="checkbox" id="mail-vac-contacts"> <span data-i18n="mail.vacRestrict">Solo ai miei contatti</span></label>
      <div class="mail-adv-dates">
        <label><span data-i18n="mail.advAfter">Dal</span> <input id="mail-vac-start" type="date" class="form-input"></label>
        <label><span data-i18n="mail.advBefore">Al</span> <input id="mail-vac-end" type="date" class="form-input"></label>
      </div>
      <div class="modal-actions" style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-primary" onclick="mfMailSaveVacation()" data-i18n="mail.save">Salva</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/contacts.js?v={{ app_version }}"></script>

<div id="mail-label-modal" class="modal-overlay">
  <div class="modal" style="display:flex;flex-direction:column;gap:10px;min-width:min(420px,92vw);">
    <h3 style="margin:0" data-i18n="mail.newLabel">Nuova etichetta</h3>
    <input name="label_name" class="form-input" data-i18n-attr="placeholder" data-i18n="mail.labelName" placeholder="Nome etichetta">
    <label class="mail-set-row mail-set-inline"><span data-i18n="mail.labelParent">Annida sotto</span>
      <select name="label_parent" class="form-input"></select>
    </label>
    <div class="modal-actions" style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-primary" onclick="mfMailCreateLabel()" data-i18n="mail.create">Crea</button>
      <button class="btn btn-secondary" onclick="closeModal('mail-label-modal')" data-i18n="mail.cancel">Annulla</button>
    </div>
  </div>
</div>

<style>
  .mail-layout { display: grid; grid-template-columns: 200px 320px 1fr; gap: 12px; height: calc(100vh - 120px); }
  .mail-nav { display: flex; flex-direction: column; }
  .mail-labels { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .mail-list { display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  .mail-thread-list { display: flex; flex-direction: column; gap: 2px; }
  .mail-actionbar { display: none; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 4px; border-bottom: 1px solid var(--border2, #333); margin-bottom: 4px; }
  .mail-sel-count { font-size: 12px; color: var(--text3, #888); margin-right: 4px; }
  .mail-move-select { height: 30px; padding: 2px 6px; font-size: 12px; width: auto; }
  .mail-loadmore { display: none; margin-top: 8px; }
  .mail-label-count { font-size: 11px; background: var(--accent, #6272f5); color: #fff; border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .mail-thread-row { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .mail-thread-row:hover { background: var(--bg3, #222); }
  .mail-sel { margin: 0; }
  .mail-star { background: none; border: 0; cursor: pointer; font-size: 15px; color: var(--text3, #888); padding: 0; }
  .mail-star.mail-star-on { color: #f5c518; }
  .mail-row-main { min-width: 0; }
  .mail-row-quick { display: none; gap: 2px; }
  .mail-thread-row:hover .mail-row-quick { display: flex; }
  .mail-q { background: none; border: 0; cursor: pointer; font-size: 14px; padding: 2px; opacity: .7; }
  .mail-q:hover { opacity: 1; }
  .mail-row-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .mail-row-from { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row-date { color: var(--text3, #888); flex-shrink: 0; }
  .mail-row-subj { font-size: 13px; margin: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row-snip { font-size: 12px; color: var(--text3, #888); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row-count { font-size: 10px; background: var(--bg3, #333); border-radius: 8px; padding: 0 5px; margin-left: 4px; }
  .mail-thread-row.mail-unread { border-left: 3px solid var(--accent, #6272f5); }
  .mail-thread-row.mail-unread .mail-row-from,
  .mail-thread-row.mail-unread .mail-row-subj { font-weight: 700; }
  .mail-reading { overflow: auto; padding-right: 4px; }
  .mail-msg { border: 1px solid var(--border2, #333); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--bg2, #1a1a1a); }
  .mail-msg-head { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border2, #333); }
  .mail-msg-head b { font-size: 14px; }
  .mail-msg-head > div { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .mail-body-frame { width: 100%; min-height: 420px; border: 0; border-radius: 6px; background: #fff; }
  .mail-atts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .mail-att { font-size: 12px; padding: 3px 8px; border: 1px solid var(--border2, #333); border-radius: 4px; text-decoration: none; }
  .mail-msg-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .mail-mobile-bar { display: none; gap: 6px; margin-bottom: 8px; }
  #mail-mb-back { display: none; }
  /* Etichette ad albero + CRUD */
  .mail-labels-sep { height: 1px; background: var(--border2, #333); margin: 8px 0; }
  .mail-lb-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text3, #888); padding: 2px 4px; }
  .mail-lb-add { background: none; border: 0; color: var(--text3, #888); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 4px; }
  .mail-lb-add:hover { background: var(--bg3, #222); color: var(--text, #eee); }
  .mail-label-active { background: var(--bg3, #222); font-weight: 600; }
  .mail-lb-row { display: flex; align-items: center; gap: 2px; border-radius: 6px; }
  .mail-lb-row:hover { background: var(--bg3, #222); }
  .mail-lb-caret { width: 16px; flex-shrink: 0; background: none; border: 0; color: var(--text3, #888); cursor: pointer; font-size: 10px; padding: 0; }
  .mail-lb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-lb-group { color: var(--text3, #888); cursor: default; }
  .mail-lb-actions { display: none; gap: 0; flex-shrink: 0; }
  .mail-lb-row:hover .mail-lb-actions { display: flex; }
  .mail-lb-act { background: none; border: 0; cursor: pointer; color: var(--text3, #888); font-size: 12px; padding: 2px 4px; }
  .mail-lb-act:hover { color: var(--text, #eee); }
  /* Ricerca avanzata */
  .mail-search-row { display: flex; gap: 6px; align-items: center; }
  .mail-search-row #mail-search { flex: 1; }
  .mail-adv-toggle { background: var(--bg3, #222); border: 1px solid var(--border2, #333); border-radius: 6px; cursor: pointer; color: var(--text2, #ccc); font-size: 15px; padding: 6px 10px; }
  .mail-adv-toggle:hover { background: var(--bg2, #1a1a1a); }
  .mail-adv-search { display: none; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--border2, #333); border-radius: 8px; background: var(--bg2, #1a1a1a); }
  .mail-adv-search.open { display: flex; }
  .mail-adv-dates { display: flex; gap: 8px; }
  .mail-adv-dates label { display: flex; align-items: center; gap: 4px; font-size: 12px; flex: 1; }
  .mail-adv-att { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  /* Impostazioni tabbed (2d) */
  .mail-set-head { display: flex; align-items: center; justify-content: space-between; }
  .mail-set-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border2, #333); flex-wrap: wrap; }
  .mail-set-tab { background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; color: var(--text3, #888); font-size: 13px; padding: 8px 12px; }
  .mail-set-tab:hover { color: var(--text, #eee); }
  .mail-set-tab-active { color: var(--text, #eee); border-bottom-color: var(--accent, #6272f5); font-weight: 600; }
  .mail-set-panel { display: flex; flex-direction: column; gap: 10px; overflow: auto; }
  .mail-contacts-list, .mail-filters-list { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow: auto; }
  .mail-contact-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
  .mail-contact-row:hover { background: var(--bg3, #222); }
  .mail-contact-meta { min-width: 0; overflow: hidden; }
  .mail-contact-meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-contact-meta span { font-size: 12px; color: var(--text3, #888); }
  .mail-filter-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border: 1px solid var(--border2, #333); border-radius: 6px; font-size: 12px; }
  .mail-filter-form { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border2, #333); padding-top: 10px; }
  .mail-filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mail-filter-actions-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .mail-filter-actions-row select { width: auto; height: 30px; }
  /* Nav foot: sync + impostazioni */
  .mail-nav-foot { margin-top: auto; display: flex; gap: 6px; padding-top: 10px; }
  .mail-nav-tool { flex: 1; background: var(--bg3, #222); border: 1px solid var(--border2, #333); border-radius: 6px; cursor: pointer; color: var(--text2, #ccc); font-size: 15px; padding: 6px; }
  .mail-nav-tool:hover { background: var(--bg2, #1a1a1a); color: var(--text, #eee); }
  /* Impostazioni email */
  .mail-set-row { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .mail-set-inline { justify-content: space-between; }
  .mail-set-inline select { width: auto; height: 30px; padding: 2px 6px; }
  /* Bottoni azione con icona SVG */
  .mail-ico { width: 16px; height: 16px; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .mail-star svg { width: 16px; height: 16px; }
  .mail-star.mail-star-on .mail-ico { fill: currentColor; }
  .mail-q { color: var(--text3, #888); display: inline-flex; align-items: center; }
  .mail-q:hover { color: var(--text, #eee); }
  @media (max-width: 768px) {
    .mail-mobile-bar { display: flex; }
    .mail-layout { grid-template-columns: 1fr; height: calc(100dvh - 150px); }
    .mail-layout[data-mail-view="list"] .mail-nav,
    .mail-layout[data-mail-view="list"] .mail-reading { display: none; }
    .mail-layout[data-mail-view="read"] .mail-nav,
    .mail-layout[data-mail-view="read"] .mail-list { display: none; }
    .mail-layout[data-mail-view="labels"] .mail-list,
    .mail-layout[data-mail-view="labels"] .mail-reading { display: none; }
    #mail-compose .modal { position: fixed; inset: 0; min-width: 0 !important; max-width: none; width: 100vw; height: 100dvh; border-radius: 0; overflow: auto; }
  }
</style>
<script src="/static/js/mail.js?v={{ app_version }}"></script>
<script>document.addEventListener('DOMContentLoaded', function(){ mfMailInit(); });</script>
{% endblock %}
