<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifica MFA — MediaFlow</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark" style="width:38px;height:38px;border-radius:9px;background:var(--indigo);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;">MF</div>
      <span style="font-size:20px;font-weight:700;letter-spacing:-0.5px;">MediaFlow</span>
    </div>
    <p style="font-size:14px;color:var(--text2);margin-bottom:18px;">
      🔒 <strong>Verifica MFA</strong> per <span style="font-family:var(--font-mono);">{{ email }}</span>
    </p>
    <p style="font-size:12px;color:var(--text3);margin-bottom:24px;">
      Inserisci il codice a 6 cifre dalla tua app authenticator (Google Authenticator, Authy, 1Password, etc.).
    </p>
    {% if error %}
    <div style="background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--rose);margin-bottom:16px;">
      {{ error }}
    </div>
    {% endif %}
    <form method="POST" action="/auth/mfa-verify" autocomplete="off">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label class="form-label">Codice OTP</label>
        <input class="form-input" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               placeholder="000000" autofocus required
               style="font-size:24px;letter-spacing:8px;text-align:center;font-family:var(--font-mono);">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;">Verifica</button>
    </form>
    <div style="margin-top:18px;text-align:center;font-size:12px;">
      <a href="/auth/login" style="color:var(--text3);">← Annulla e torna al login</a>
    </div>
  </div>
</div>
</body>
</html>
