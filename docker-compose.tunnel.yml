# v3.5.0-alpha.172.173 — Self-host da ufficio/casa con Cloudflare Tunnel (named).
# claqo NON espone porte sull'host né su internet: cloudflared apre una
# connessione USCENTE verso Cloudflare (niente port-forward, niente IP pubblico,
# funziona dietro CGNAT). HTTPS + hostname stabile gestiti da Cloudflare.
#
# Setup (vedi docs/SELF-HOST.md):
#   1. Crea un tunnel "named" in Cloudflare Zero Trust → copia il TUNNEL_TOKEN
#   2. Nel dashboard del tunnel: Public hostname  →  Service: http://claqo:8000
#   3. Metti TUNNEL_TOKEN in .env, poi:
#      docker compose -f docker-compose.tunnel.yml up -d --build
services:
  claqo:
    build: .
    image: claqo:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      AUTH_REQUIRED: "true"
      DATABASE_URL: sqlite:////data/mediaflow.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - claqo_data:/data
    expose:
      - "8000"            # solo rete interna; raggiunta da cloudflared
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - claqo
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

volumes:
  claqo_data:
